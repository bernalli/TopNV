name: Release

# Builds TopNV.app, packs it into TopNV.dmg and publishes it as a GitHub Release.
#
# - Push a tag like v1.0.0 to publish a release for that tag, or
# - run this workflow from the Actions tab and enter a version (for example 1.0.0); the
#   workflow creates the tag v<version> on the selected branch.
#
# Every run also keeps the DMG as a workflow artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid version '$version', expected something like 1.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build app (universal)
        env:
          TOPNV_VERSION: ${{ steps.version.outputs.version }}
          TOPNV_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/bundle.sh --arch arm64 --arch x86_64

      - name: Build DMG
        run: scripts/make-dmg.sh "build/TopNV-${{ steps.version.outputs.version }}.dmg"

      - name: Keep DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopNV-${{ steps.version.outputs.version }}
          path: build/TopNV-${{ steps.version.outputs.version }}.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TopNV ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/TopNV-${{ steps.version.outputs.version }}.dmg
          body: |
            Download **TopNV-${{ steps.version.outputs.version }}.dmg** below, open it and
            drag **TopNV** into **Applications**.

            TopNV is not notarized: the first time, right-click the app in Applications and
            choose **Open**, then confirm (or allow it in System Settings > Privacy & Security).

            Requires macOS 14 or later.
