name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version with three numeric components
        required: true
      channel:
        description: Release channel
        type: choice
        options: [stable, proof]
        default: stable
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_CHANNEL: ${{ inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fetch current main
        run: git fetch origin main
      - name: Resolve and authorize sources
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh resolve
      - name: Require signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/require-signing-key.sh
      - name: Toolchain and tests
        run: |
          xcodebuild -version
          swift test
          scripts/tests/run-all.sh
          swift build -c release --product release-check
      - name: Enforce release order
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh order
      - name: Build universal app
        env:
          TOPNV_VERSION: ${{ steps.release.outputs.version }}
          TOPNV_BUILD_NUMBER: ${{ github.run_number }}
          TOPNV_FEED_URL: ${{ steps.release.outputs.feed }}
          TOPNV_EXPECT_FEED_URL: ${{ steps.release.outputs.feed }}
          TOPNV_EXPECT_UNIVERSAL: '1'
        run: |
          scripts/bundle.sh --arch arm64 --arch x86_64
          scripts/verify-bundle.sh build/TopNV.app
      - name: Build disk image
        env:
          TOPNV_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/make-dmg.sh "build/TopNV-${TOPNV_VERSION}.dmg"
      - name: Sign appcast with stdin
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TOPNV_VERSION: ${{ steps.release.outputs.version }}
          TOPNV_DOWNLOAD_PREFIX: ${{ steps.release.outputs.prefix }}
          TOPNV_RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: scripts/sign-release.sh
      - name: Verify signed assets and mounted app
        run: scripts/verify-release-assets.sh
      - name: Keep verified assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TopNV-${{ steps.release.outputs.version }}
          path: |
            build/TopNV-${{ steps.release.outputs.version }}.dmg
            build/appcast.xml
          if-no-files-found: error
      - name: Publish verified draft and read back
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh publish
      - name: Recover this run after failure or cancellation
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh recover
